models:
  active_model: "stgcn"

  stgcn:
    in_channels: 3
    num_class: 100
    graph_layout: "isl_skeleton"
    edge_importance_weighting: true
    dropout: 0.5

  transformer:
    d_model: 256
    nhead: 8
    num_encoder_layers: 6
    dim_feedforward: 1024
    dropout: 0.1
    max_seq_len: 60

  bilstm:
    input_dim: 225
    hidden_dim: 128
    num_layers: 2
    dropout: 0.3

training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  optimizer: "adamw"
  scheduler: "cosine_annealing"
