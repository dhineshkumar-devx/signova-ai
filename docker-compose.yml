version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: isl_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isl_password}
      POSTGRES_DB: ${POSTGRES_DB:-isl_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isl_user -d isl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isl_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-isl_user}:${POSTGRES_PASSWORD:-isl_password}@postgres:5432/${POSTGRES_DB:-isl_db}
      SECRET_KEY: ${SECRET_KEY:-super_secret_key_change_me_in_production}
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./ml:/app/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: isl_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000/ws
    depends_on:
      - backend

volumes:
  postgres_data:
